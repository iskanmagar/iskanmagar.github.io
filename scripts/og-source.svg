<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c10"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#2ee6d6" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="920" cy="315" r="430" fill="url(#glow)"/>

  <!-- scanlines -->
  <g fill="#000000" fill-opacity="0.14">
    <rect x="0" y="0" width="1200" height="2"/>
  </g>

  <!-- TV set -->
  <g transform="translate(880,315)">
    <circle r="185" fill="none" stroke="#1c2129" stroke-width="22"/>
    <circle r="160" fill="#0b0d11" stroke="#141820" stroke-width="6"/>
    <!-- SMPTE bars -->
    <g transform="translate(-120,-150)">
      <rect x="0"   y="0" width="34" height="70" fill="#e5e7eb"/>
      <rect x="34"  y="0" width="34" height="70" fill="#ffb020"/>
      <rect x="68"  y="0" width="34" height="70" fill="#2ee6d6"/>
      <rect x="102" y="0" width="34" height="70" fill="#48e06a"/>
      <rect x="136" y="0" width="34" height="70" fill="#ff4fa3"/>
      <rect x="170" y="0" width="34" height="70" fill="#ef4444"/>
      <rect x="204" y="0" width="36" height="70" fill="#2563eb"/>
    </g>
    <path d="M-34 -6 L44 40 L-34 86 Z" fill="#2ee6d6"/>
  </g>

  <!-- Text -->
  <g font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif">
    <text x="90" y="150" fill="#2ee6d6" font-size="24" font-family="'JetBrains Mono',monospace" letter-spacing="8">▶ NOW BROADCASTING</text>
    <text x="86" y="300" fill="#ffffff" font-size="94" font-weight="700" letter-spacing="-2">Broadcasting</text>
    <text x="86" y="400" fill="#ffffff" font-size="94" font-weight="700" letter-spacing="-2">from <tspan fill="#2ee6d6">the edge</tspan>.</text>
    <text x="90" y="470" fill="#9aa4b2" font-size="27" font-family="'JetBrains Mono',monospace">Iskanmagar Broadcast Network</text>
  </g>

  <!-- Tifinagh wordmark -->
  <text x="90" y="560" fill="#2ee6d6" fill-opacity="0.65" font-size="30" letter-spacing="10" font-family="'Space Grotesk',sans-serif">ⵉⵙⴽⴰⵏⵎⴰⴳⴰⵔ</text>

  <rect x="0" y="622" width="1200" height="8" fill="#2ee6d6"/>
</svg>
